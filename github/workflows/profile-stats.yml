## `04.` One-time setup (do this once — nothing above will render until you do)

Both the stats/top-langs cards and the snake need a workflow file added to your **`balaji190903/balaji190903`** repo. This is a one-time, ~5 minute setup:

1. In that repo, create a folder path `.github/workflows/` if it doesn't exist yet
2. Add the `profile-stats.yml` file (provided separately) into that folder — this generates `profile/stats.svg` and `profile/top-langs.svg`
3. Add the `snake.yml` file (provided separately) into the same folder — this generates the snake SVG on an `output` branch
4. Commit both files to `main`
5. Go to the **Actions** tab of the repo — you should see both workflows listed; click each and hit **Run workflow** to trigger them manually the first time (don't wait for the schedule)
6. Refresh your profile page after both runs finish (green checkmark) — the stats card, top-langs card, and snake should all now render

